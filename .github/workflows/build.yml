{
 "name": "Build Drift Live",
 "on": {
  "workflow_dispatch": {
   "inputs": {
    "platform": {
     "description": "Which system to build",
     "type": "choice",
     "options": [
      "mac",
      "windows",
      "linux",
      "all"
     ],
     "default": "mac"
    }
   }
  }
 },
 "jobs": {
  "mac": {
   "if": "inputs.platform == 'mac' || inputs.platform == 'all'",
   "runs-on": "macos-latest",
   "steps": [
    {
     "uses": "actions/checkout@v4"
    },
    {
     "name": "Configure (universal, Apple Silicon and Intel)",
     "run": "cmake -B build -DCMAKE_BUILD_TYPE=Release \"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64\" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
    },
    {
     "name": "Build",
     "run": "cmake --build build --config Release -j 4"
    },
    {
     "name": "Collect",
     "run": "mkdir -p out && cp -R build/DriftLive_artefacts/Release/VST3/. out/ && cp -R build/DriftLive_artefacts/Release/AU/. out/ && cp -R build/DriftLive_artefacts/Release/Standalone/. out/"
    },
    {
     "uses": "actions/upload-artifact@v4",
     "with": {
      "name": "DriftLive-mac",
      "path": "out",
      "retention-days": 3
     }
    }
   ]
  },
  "linux": {
   "if": "inputs.platform == 'linux' || inputs.platform == 'all'",
   "runs-on": "ubuntu-22.04",
   "steps": [
    {
     "uses": "actions/checkout@v4"
    },
    {
     "name": "Install dependencies",
     "run": "sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libasound2-dev libjack-jackd2-dev    libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev    libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev"
    },
    {
     "name": "Configure",
     "run": "cmake -B build -DCMAKE_BUILD_TYPE=Release"
    },
    {
     "name": "Build",
     "run": "cmake --build build --config Release -j 4"
    },
    {
     "name": "Collect",
     "run": "mkdir -p out && cp -R build/DriftLive_artefacts/Release/VST3/. out/ && cp -R build/DriftLive_artefacts/Release/LV2/. out/ && cp -R build/DriftLive_artefacts/Release/Standalone/. out/"
    },
    {
     "uses": "actions/upload-artifact@v4",
     "with": {
      "name": "DriftLive-linux",
      "path": "out",
      "retention-days": 3
     }
    }
   ]
  },
  "windows": {
   "if": "inputs.platform == 'windows' || inputs.platform == 'all'",
   "runs-on": "windows-2022",
   "steps": [
    {
     "uses": "actions/checkout@v4"
    },
    {
     "name": "Configure",
     "run": "cmake -B build -G \"Visual Studio 17 2022\" -A x64"
    },
    {
     "name": "Build",
     "run": "cmake --build build --config Release -j 4"
    },
    {
     "name": "Collect",
     "shell": "bash",
     "run": "mkdir -p out && cp -R build/DriftLive_artefacts/Release/VST3/. out/ && cp -R build/DriftLive_artefacts/Release/Standalone/. out/"
    },
    {
     "uses": "actions/upload-artifact@v4",
     "with": {
      "name": "DriftLive-windows",
      "path": "out",
      "retention-days": 3
     }
    }
   ]
  }
 }
}
